<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senni H. - Official Artist Page</title>
    <!-- Nhúng font chữ Inter hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Nhúng thư viện icon FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #a7a7a7;
            --accent-color: #6c5ce7; /* Màu tím nghệ sĩ */
            --accent-hover: #5b4bc4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .artist-container {
            max-width: 650px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 1s ease-in-out;
        }

        /* --- XỬ LÝ LỖI RĂNG CƯA CỦA ẢNH --- */
        .image-wrapper {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--accent-color);
            box-shadow: 0 0 30px rgba(108, 92, 231, 0.4);
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.15); /* Phóng to để che viền răng cưa */
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #fff, #a7a7a7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .roles {
            font-size: 0.9rem;
            color: var(--accent-color);
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        /* --- EMAIL --- */
        .email-display {
            font-size: 1rem;
            color: var(--text-color);
            background-color: var(--card-bg);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid #333;
            margin-bottom: 40px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        
        .email-display i {
            color: var(--accent-color);
        }

        /* --- TIÊU ĐỀ CÁC MỤC --- */
        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            width: 100%;
            text-align: left;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- COUNTDOWN --- */
        .countdown-section {
            width: 100%;
            text-align: center;
            margin-bottom: 40px;
            padding: 25px;
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid #333;
        }
        .countdown-section .section-title {
            text-align: center;
            border-bottom: none;
            margin-bottom: 15px;
        }
        .release-info h3 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 5px;
        }
        .release-info p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .countdown-timer {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .time-unit span:first-child {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent-color);
            line-height: 1;
        }
        .time-unit span:last-child {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 5px;
        }
        .pre-save-btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: #fff;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }
        .pre-save-btn:hover {
            background-color: var(--accent-hover);
        }

        /* --- WORKS / SẢN PHẨM --- */
        .works-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 40px;
        }

        .work-item {
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column; /* Chuyển thành cột để chứa nút bên dưới */
            align-items: flex-start;
            gap: 15px;
            transition: all 0.2s ease;
            border-left: 3px solid var(--accent-color);
        }

        .work-item:hover {
            background-color: #2a2a2a;
            transform: translateX(5px);
        }

        .work-info h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #fff;
        }

        .work-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .work-actions {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn-preview, .btn-listen {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            font-family: 'Inter', sans-serif;
        }

        .btn-preview {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
        }
        .btn-preview:hover {
            background-color: #3a3a3a;
            border-color: var(--accent-color);
        }

        .btn-listen {
            background-color: #1DB954;
            color: #000;
        }
        .btn-listen:hover {
            background-color: #1ed760;
            transform: translateY(-2px);
        }

        .preview-box {
            width: 100%;
            margin-top: 10px;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- STREAMING LINKS --- */
        .streaming-links {
            display: flex;
            gap: 20px;
            justify-content: center;
            width: 100%;
        }

        .stream-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            background-color: var(--card-bg);
            border-radius: 15px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            gap: 8px;
            transition: all 0.3s ease;
            border: 1px solid #333;
        }

        .stream-btn i {
            font-size: 2rem;
        }

        .stream-btn:hover {
            transform: translateY(-5px);
            background-color: #2a2a2a;
            border-color: var(--accent-color);
        }

        .stream-btn.spotify i { color: #1DB954; }
        .stream-btn.apple i { color: #FA243C; }
        .stream-btn.youtube i { color: #FF0000; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .stream-btn { width: 75px; height: 75px; font-size: 0.65rem; }
            .stream-btn i { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <div class="artist-container">
        <!-- Avatar -->
        <div class="image-wrapper">
            <img src="https://raw.githubusercontent.com/hoangtrucnhi/Senni-H./refs/heads/main/Senni-H.png" alt="Senni. H Portrait">
        </div>
        
        <!-- Thông tin cơ bản -->
        <h1>Senni. H</h1>
        <div class="roles">Producer • Beat Maker • Songwriter</div>
        
        <!-- Email -->
        <div class="email-display">
            <i class="fa-solid fa-envelope"></i>
            hoangtrucnhi1607@gmail.com
        </div>

        <!-- Phần Countdown -->
        <div class="countdown-section">
            <h2 class="section-title">Upcoming Release</h2>
            <div class="release-info">
                <h3>Neon Shibuya</h3>
                <p>Single • 2026</p>
            </div>
            <div id="countdown-timer" class="countdown-timer">
                <div class="time-unit"><span id="days">00</span><span>Days</span></div>
                <div class="time-unit"><span id="hours">00</span><span>Hours</span></div>
                <div class="time-unit"><span id="minutes">00</span><span>Mins</span></div>
                <div class="time-unit"><span id="seconds">00</span><span>Secs</span></div>
            </div>
            <a href="https://open.spotify.com/artist/7h2ZhULQ8glRwTUgsr1MOx" target="_blank" class="pre-save-btn">Pre-save on Spotify</a>
        </div>

        <!-- Mục Sản Phẩm / Works -->
        <h2 class="section-title">Latest Works</h2>
        <div class="works-list">
            
            <!-- Khung bài hát Kyoto Morning -->
            <div class="work-item">
                <div class="work-info">
                    <h3>Kyoto Morning</h3>
                    <p>Instrumental • Chillhop • Single • 2026</p>
                </div>
                <div class="work-actions">
                    <button class="btn-preview" onclick="togglePreview('kyoto-preview')">
                        <i class="fa-solid fa-headphones"></i> Preview
                    </button>
                    <a href="https://open.spotify.com/track/2lTJSoIrZqdnCp7fWCK0aJ?autoplay_ok=1" target="_blank" class="btn-listen">
                        <i class="fa-brands fa-spotify"></i> Listen
                    </a>
                </div>
            </div>

            <!-- Khung chứa Spotify Embed (Ẩn mặc định) -->
            <div id="kyoto-preview" class="preview-box" style="display: none;">
                <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/2lTJSoIrZqdnCp7fWCK0aJ?utm_source=generator&theme=0" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
            </div>

        </div>

        <!-- Mục Link Nghe Nhạc -->
        <h2 class="section-title">Listen On</h2>
        <div class="streaming-links">
            <a href="https://open.spotify.com/artist/7h2ZhULQ8glRwTUgsr1MOx" class="stream-btn spotify" target="_blank">
                <i class="fa-brands fa-spotify"></i>
                Spotify
            </a>
            <a href="#" class="stream-btn apple" target="_blank">
                <i class="fa-brands fa-apple"></i>
                Apple Music
            </a>
            <a href="#" class="stream-btn youtube" target="_blank">
                <i class="fa-brands fa-youtube"></i>
                YT Music
            </a>
        </div>
    </div>

    <!-- TOÀN BỘ JAVASCRIPT ĐƯỢC ĐƯA XUỐNG ĐÂY -->
    <script>
        // 1. Hàm đếm ngược thời gian
        const countdownDate = new Date("Oct 15, 2026 08:00:00 GMT+0700").getTime();

        const interval = setInterval(function() {
            const now = new Date().getTime();
            const distance = countdownDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            if (distance < 0) {
                clearInterval(interval);
                document.getElementById("countdown-timer").innerHTML = "<h3>OUT NOW!</h3>";
            }
        }, 1000);

        // 2. Hàm bật/tắt khung Preview
        function togglePreview(id) {
            var x = document.getElementById(id);
            if (x.style.display === "none" || x.style.display === "") {
                x.style.display = "block";
            } else {
                x.style.display = "none";
            }
        }
    </script>
</body>
</html>
