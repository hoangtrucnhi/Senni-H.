<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senni. H - Official Artist Page</title>
    <!-- Nhúng font chữ Inter hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Nhúng thư viện icon FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #a7a7a7;
            --accent-color: #6c5ce7; /* Màu tím nghệ sĩ */
            --accent-hover: #5b4bc4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .artist-container {
            max-width: 650px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 1s ease-in-out;
        }

        /* --- XỬ LÝ LỖI RĂNG CƯA CỦA ẢNH --- */
        .image-wrapper {
            width: 200px;
            height: 200px;
            border-radius: 50%; /* Bo tròn hoàn hảo */
            overflow: hidden; /* Cắt bỏ mọi phần thừa ra ngoài hình tròn */
            border: 3px solid var(--accent-color);
            box-shadow: 0 0 30px rgba(108, 92, 231, 0.4);
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Phóng to ảnh 10% để che đi viền răng cưa ở rìa */
            transform: scale(1.15); 
        }
        /* ---------------------------------- */

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #fff, #a7a7a7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .roles {
            font-size: 0.9rem;
            color: var(--accent-color);
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        /* --- EMAIL HIỂN THỊ RÕ RÀNG --- */
        .email-display {
            font-size: 1rem;
            color: var(--text-color);
            background-color: var(--card-bg);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid #333;
            margin-bottom: 40px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        
        .email-display i {
            color: var(--accent-color);
        }

        /* --- PHẦN SẢN PHẨM (WORKS) --- */
        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            width: 100%;
            text-align: left;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .works-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 40px;
        }

        .work-item {
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s ease;
            border-left: 3px solid var(--accent-color);
        }

        .work-item:hover {
            background-color: #2a2a2a;
        }

        .work-info h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .work-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .work-tag {
            font-size: 0.75rem;
            background-color: rgba(108, 92, 231, 0.2);
            color: var(--accent-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        /* --- PHẦN LIÊN KẾT STREAMING --- */
        .streaming-links {
            display: flex;
            gap: 20px;
            justify-content: center;
            width: 100%;
        }

        .stream-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            background-color: var(--card-bg);
            border-radius: 15px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 600;
            gap: 8px;
            transition: all 0.3s ease;
            border: 1px solid #333;
        }

        .stream-btn i {
            font-size: 1.8rem;
        }

        .stream-btn:hover {
            transform: translateY(-5px);
            background-color: #2a2a2a;
            border-color: var(--accent-color);
        }

        /* Màu icon chuẩn của các nền tảng */
        .stream-btn.spotify i { color: #1DB954; }
        .stream-btn.apple i { color: #FA243C; }
        .stream-btn.youtube i { color: #FF0000; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .stream-btn { width: 70px; height: 70px; font-size: 0.6rem; }
            .stream-btn i { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="artist-container">
        <!-- Avatar -->
        <div class="image-wrapper">
            <img src="https://raw.githubusercontent.com/hoangtrucnhi/Senni-H./refs/heads/main/Senni-H.png" alt="Senni. H Portrait">
        </div>
        
        <!-- Thông tin cơ bản -->
        <h1>Senni. H</h1>
        <div class="roles">Producer • Beat Maker • Songwriter</div>
        
        <!-- Email hiển thị rõ ràng -->
        <div class="email-display">
            <i class="fa-solid fa-envelope"></i>
            hoangtrucnhi1607@gmail.com
        </div>

        <!-- Mục Sản Phẩm / Works -->
        <h2 class="section-title">Latest Works</h2>
        <div class="works-list">
            <!-- Bạn có thể sửa tên các sản phẩm ở đây -->
            <div class="work-item">
                <div class="work-info">
                    <h3>Midnight Vibes</h3>
                    <p>Beat Tape / 2024</p>
                </div>
                <span class="work-tag">Producer</span>
            </div>
            <div class="work-item">
                <div class="work-info">
                    <h3>Echoes of Silence</h3>
                    <p>Single / 2024</p>
                </div>
                <span class="work-tag">Songwriter</span>
            </div>
            <div class="work-item">
                <div class="work-info">
                    <h3>Lofi Chill Beats Vol. 1</h3>
                    <p>EP / 2023</p>
                </div>
                <span class="work-tag">Beat Maker</span>
            </div>
        </div>

        <!-- Mục Link Nghe Nhạc -->
        <h2 class="section-title">Listen On</h2>
        <div class="streaming-links">
            <!-- LƯU Ý: Thay dấu # bằng link kênh Spotify thật của bạn -->
            <a href="#" class="stream-btn spotify" target="_blank">
                <i class="fa-brands fa-spotify"></i>
                Spotify
            </a>
            <!-- LƯU Ý: Thay dấu # bằng link Apple Music thật của bạn -->
            <a href="#" class="stream-btn apple" target="_blank">
                <i class="fa-brands fa-apple"></i>
                Apple Music
            </a>
            <!-- LƯU Ý: Thay dấu # bằng link YouTube Music thật của bạn -->
            <a href="#" class="stream-btn youtube" target="_blank">
                <i class="fa-brands fa-youtube"></i>
                YT Music
            </a>
        </div>
    </div>

</body>
</html>
