<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senni. H - Official Artist Page</title>
    <!-- Nhúng font chữ hiện đại, chuẩn UI nghệ sĩ -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Bảng màu chuẩn Spotify for Artists */
            --bg-color: #121212;
            --text-color: #ffffff;
            --text-muted: #a7a7a7;
            --accent-color: #6c5ce7; /* Màu tím nghệ sĩ */
            --accent-hover: #5b4bc4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .artist-container {
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 1s ease-in-out;
        }

        /* --- XỬ LÝ LỖI RĂNG CƯA CỦA ẢNH --- */
        .image-wrapper {
            width: 220px;
            height: 220px;
            border-radius: 50%; /* Bo tròn hoàn hảo */
            overflow: hidden; /* Cắt bỏ mọi phần thừa ra ngoài hình tròn */
            border: 3px solid var(--accent-color);
            box-shadow: 0 0 30px rgba(108, 92, 231, 0.4);
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Phóng to ảnh 10% để che đi viền răng cưa ở rìa */
            transform: scale(1.1); 
        }
        /* ---------------------------------- */

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #fff, #a7a7a7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .roles {
            font-size: 0.95rem;
            color: var(--accent-color);
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .contact-btn {
            display: inline-block;
            padding: 14px 35px;
            background-color: var(--accent-color);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }

        .contact-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive cho điện thoại */
        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .image-wrapper { width: 180px; height: 180px; }
        }
    </style>
</head>
<body>

    <div class="artist-container">
        <!-- Khung ảnh được bọc để che viền răng cưa -->
        <div class="image-wrapper">
            <img src="https://raw.githubusercontent.com/hoangtrucnhi/Senni-H./refs/heads/main/Senni-H.png" alt="Senni. H Portrait">
        </div>
        
        <h1>Senni. H</h1>
        <div class="roles">Producer • Beat Maker • Songwriter</div>
        
        <!-- Nút liên hệ, dùng mailto để mở thẳng email -->
        <a href="mailto:hoangtrucnhi1607@gmail.com" class="contact-btn">Contact Me</a>
    </div>

</body>
</html>
